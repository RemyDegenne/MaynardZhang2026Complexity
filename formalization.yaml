# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.
# See https://github.com/mathlib-initiative/formalization.yaml for the fields.

version: "v0.4"

project:
  name: "MaynardZhang2026Complexity"
  description: >-
    A Lean 4 / Mathlib formalization of "On the Complexity of Best-Arm Identification in
    Non-Stationary Linear Bandits" (Maynard-Zhang, Xiong, Jamieson, Fazel, COLT 2026): the
    arm-set-dependent complexity H_Adjacent(X, Δ) = min_λ max_{(x, x') adjacent}
    ‖x - x'‖²_{A(λ)⁻¹} / Δ² of fixed-budget best-arm identification in linear bandits with a
    parameter sequence fixed in advance, through a lower bound exp(-4T / H_Adjacent) for every
    algorithm and the matching upper bound of the Adjacent-BAI algorithm, both resting on the
    adjacency lemma (a vertex of the convex hull of the arms that is not beaten by its adjacent
    vertices is optimal). Algorithms and environments are those of the LML (Lean Machine
    Learning) library; the geometry of the vertices and edges of the convex hull of a finite set,
    the information-theoretic lower bound for non-stationary bandits and the concentration of
    sums over random permutations are written in library generality, to be contributed to LML and
    Mathlib. The development is blueprint-driven and proceeds in two phases: phase 1 states the
    results (this file lists them; their statements are `sorry`-ed challenge statements for
    leanprover/comparator), phase 2 proves them.
  authors:
    - "Rémy Degenne"
  responsible_maintainers:
    - "Rémy Degenne"
  license: "Apache-2.0"
  # extra keys (tolerated by the schema), kept for convenience:
  repository: "https://github.com/RemyDegenne/MaynardZhang2026Complexity"
  blueprint: "https://remydegenne.github.io/MaynardZhang2026Complexity/blueprint/"

# This repository is the substantive formalization, not a packaging or comparison layer.
repository:
  role: "substantive-development"

sources:
  - title: "On the Complexity of Best-Arm Identification in Non-Stationary Linear Bandits"
    authors:
      - "Leo Maynard-Zhang"
      - "Zhihan Xiong"
      - "Kevin Jamieson"
      - "Maryam Fazel"
    id: "arXiv:2603.10346v1 (COLT 2026)"
    type: "conference-paper"
    location: "Lemmas 1-10, Theorems 1-2, Proposition 1; see status.scope"
    relationship: "formalizes"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      The LaTeX source of the paper (arXiv 2603.10346v1) is vendored in this repository under
      `source/`. The formalization is driven by a blueprint (`blueprint/src/`, written by Claude
      with the formalizer's review) that decomposes the paper's proofs into small lemmas, proves
      the adjacency lemma without the theory of polytopes, and replaces the half-horizon
      construction of the lower bound by one with slack; the blueprint is a derived artifact of
      this project, not an independent source. The statements started from the statement-only
      formalization of the paper in `LMLPapers` (COLT2026/MaynardZhang2026Complexity). The
      formalizer is not an author of the paper. The errors found in the paper, with their
      corrections, are in `notes/paper-errata.md`.

related_formalizations: []   # no earlier or parallel formalization with proofs is known

# Bandits, best-arm identification, optimal design, polytopes.
classification:
  arxiv: ["cs.LG", "stat.ML"]
  msc2020:
    - "68T05"   # learning and adaptive systems
    - "62L05"   # sequential statistical design
    - "62K05"   # optimal statistical designs
    - "52B05"   # combinatorial properties of polytopes

status:
  scope: >-
    Phases 1 (statements) and 2 (proofs), 2026-10-08. The results of the paper are stated in Lean, each as a
    `sorry`-ed theorem (headline results, comparator targets listed in `comparator/targets.txt`),
    over definitions written in library generality. Namespace `MaynardZhang2026Complexity`, files
    `MaynardZhang2026Complexity/MXJF2026/<Result>.lean`; blueprint labels in parentheses.

    Setting (Sections 2-3, `Setting.lean`): a finite arm set `𝒳 ⊆ ℝ^d`
    (`Finset (EuclideanSpace ℝ ι)`), the non-stationary linear bandit `nonstationaryLinearEnv`
    (reward `⟪x, θ_t⟫ + ε_t`), fixed-budget LML identification algorithms, best arm for the
    average parameter `θ̄_T` (`IsBestArm`), min-gap over the vertices of `conv 𝒳` (`MinGapGE`),
    vertices and adjacent pairs (exposed points and exposed segments of `conv 𝒳`), designs and
    the complexity `H_Adjacent` (`hAdjacent`, minimum over designs with positive definite design
    matrix), the optimization problem `f(𝒳, Δ)` (`optValue`), Algorithm 1 (`adjacentBAI`, with
    the guarantee of the rounding procedure as the hypothesis `IsAdjacentRounding`).
    Lemma 1 (`exists_pos_inner_iff`, `lem:adjacency`): adjacency lemma.
    Theorem 1 (`exists_minGapGE_le_max_error`, `thm:lower_bound`): lower bound
    `(1/4) exp(-4T / H_Adjacent)`; `T ≥ 1` and two arms added (false otherwise).
    Lemma 2 (`le_max_prob_ne`, `lem:gen_lower`): non-stationary Kaufmann-Cappé-Garivier bound, for
    any two distinct arms.
    Lemma 3 (`exists_minGapGE_le_max_error_optValue`, `lem:opt_lower`): lower bound
    `(1/4) exp(-T f(𝒳, Δ))`; `T ≥ 1` and two arms added, spanning not needed.
    Lemma 4 (`pairValue_eq`, `lem:equality`), Lemma 7 (`le_pairValue`), Lemma 8 (`pairValue_le`):
    the inner problem for adjacent pairs.
    Theorem 2 (`prob_ne_bestArm_le`, `thm:upper_bound`): error of Adjacent-BAI at most
    `|ℐ^{x⋆}| exp(-T / (36 H_Adjacent))`.
    Lemma 5 (`hasSubgaussianMGF_lsEstimator`, `lem:ls_subgaussian`): `3 ‖z‖_{A⁻¹}`-sub-Gaussian
    least-squares error; the bounds `‖x_t‖ ≤ 1`, `‖θ_t‖ ≤ 1` added (false otherwise).
    Lemma 6 (`trajMeasure_eq_lintegral_exp_neg_llrProcess`, `lem:change_of_measure`): change of
    measure at a stopping time, countably many arms, `L_{σ + 1}` with rounds numbered from `0`.
    Lemma 9 (`hasSubgaussianMGF_sum_perm`, `lem:perm_subgaussian`): sums over a uniform random
    permutation.
    Lemma 10 (`ratio_le_iSup_adjacentTo`), Proposition 1 (`iInf_iSup_ratio_eq`,
    `prop:stat_equiv`): the stationary fixed-confidence complexity only involves the arms
    adjacent to the best arm.
    Not formalized: the rounding procedure and the computation of the adjacent pairs
    (Appendix C), which are algorithms whose guarantees the statements take as hypotheses or do
    not need.

    Corrections to the paper's statements (`notes/blueprint-outline.md`, section 3): Lemma 5 is
    false without the norm bounds of Theorem 2 (counterexample `x = (1, 2)`, `θ = (-10, 10)`);
    Theorem 1 and Lemma 3 are false for `T = 0` and for a single arm. Hypotheses that the proofs
    do not use are dropped (best arms in Lemma 2, spanning in Lemma 3 and Proposition 1, design
    matrices in Lemma 4, `Δ > 0` in Lemma 8, `T ≥ d²` in Theorem 2). Proof routes that differ
    from the paper: the adjacency lemma is proved by induction on the number of points (the
    paper cites the cone property of polytopes, not in Mathlib); the lower bound of Lemma 3
    spreads the difference between the two instances over all rounds with zero parameters before
    the last round, which halves the exponent (the paper's half-horizon split needs the inner
    minimum to be attained and fails for `T = 1`); Lemma 2 goes through the chain rule for the
    divergence of the histories instead of Lemma 6; Lemma 9 by induction on the horizon instead
    of a Doob martingale.

    The blueprint (7 chapters) decomposes every proof into labelled lemmas; the plan is in
    `notes/blueprint-outline.md`. The 13 comparator challenges compile (`lake build Comparator`).

    Phase 2 complete on 2026-10-08 (four packages, `notes/phase2-plan.md`): every result listed
    above is proved, with no `sorry` in the library, and the 13 headline theorems depend only on
    the axioms `propext`, `Classical.choice`, `Quot.sound`. `lake build
    MaynardZhang2026Complexity --wfail`, `lake exe runLinter MaynardZhang2026Complexity` and
    `lake exe checkdecls blueprint/lean_decls` pass; every blueprint statement and proof is
    `\leanok`. One statement was corrected in phase 2: Lemma 6 (`lem:change_of_measure`) was
    mistranslated in phase 1 (LML's `𝓕_n` covers the rounds `0, …, n` while `L_n` covers
    `0, …, n - 1`, so the identity holds with `L_{σ + 1}`, the paper's `L_σ` with rounds numbered
    from `1`; the phase-1 statement with `L_σ` is false for `σ = 0`); its challenge was
    regenerated. The other 12 statements and the definitions in their closure are unchanged (the
    regenerated challenges differ only in imports, `open` lines, docstrings and namespace stubs);
    the full comparator run (`scripts/comparator-verify.sh`) has not been done yet.
    Proof routes that differ from the paper: the adjacency lemma by a direct argument (a vertex
    of the set of normalized directions from `x`, then the farthest point on a ray; no theory of
    faces); Lemma 3 by the construction with slack (`θ_t = 0` before the last round); Lemma 2
    through the chain rule for the histories; Lemma 9 by induction on the horizon with the
    proxy `8M² ∑ ‖a_s - ā‖²` (Helmert identity) instead of the paper's Doob martingale and
    orthogonal-column bound; Lemma 5 on an explicit model of the run (uniform permutation
    independent of the noises) instead of conditional sub-Gaussianity. Library material to
    upstream: `notes/upstreaming-candidates.md`.

    Linter cleanup, 2026-10-09: the library has no `set_option` and no `@[nolint]`. Lemma 9
    no longer assumes that the `x_t` span `ℝ^d`, which its proof does not use (for a singular
    matrix `A⁻¹ = 0` in Lean and both sides vanish); the statement is strictly stronger and its
    challenge is regenerated. The `CFC.sqrt` lemmas of `Matrix/Order.lean` are elaborated with
    the classical `DecidableEq` instance instead of silencing `unusedDecidableInType`.

    Move to LMLExplore, 2026-11-09: the project builds on LMLExplore (Lean v4.36.0-rc2) in the
    layout of lml-paper-template, the library-shaped material in
    `MaynardZhang2026Complexity/ForLMLExplore/`. Mathlib replaced `PMF.uniformOfFintype` and
    `PMF.ofMultiset` by the measures `Measure.uniformOfFinset` and `Measure.ofMultiset`: Lemma 9
    and the random-order sampling of Adjacent-BAI (`multisetUniform`) name the uniform law
    `Measure.uniformOfFinset Finset.univ`, the same measure, so no statement changes meaning. The
    13 challenges are regenerated by challenge-gen and import LML and Mathlib instead of copying
    LML's definitions (unchanged, up to LML dropping the `IsFiniteMeasure` parameter of
    `IsAlgEnvSeq` and `IdentAlg.IsRun`); `scripts/comparator-verify.sh` has still to be run.
    Errors of the paper: `notes/paper-errata.md` (E1 Lemma 5, E2 Theorem 1 and Lemma 3, E3 the
    proof of Lemma 3).

    Paper roadmap, 2026-11-09: `PAPER_ROADMAP.md` tags the 20 prerequisites against LMLExplore
    afd365492580 and LMLRoadmaps d01bdd6b89ce: 7 already in the dependencies (`exists`: the
    identification framework, designs and weighted norms as operators, Bretagnolle-Huber, the
    Gaussian divergence, small probability lemmas), 1 `target` (data processing for the output,
    Identification 2.1), 2 `refactor` (runs against environments agreeing before a round, linear
    kernels with any noise law), 7 `staged` with proposed targets (vertices and edges of
    polytopes, the non-stationary divergence decomposition and likelihood-ratio identity,
    conditional laws, random-order allocations and their runs, concentration for sampling without
    replacement) and 3 `paper`.

    Comparator, 2026-11-09: scripts/formalize.sh ran scripts/comparator-verify.sh on the
    regenerated challenges, and comparator verifies all 13 headline results.
  sorry_count: 0
  sorry_in_definitions: 0

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code in a local checkout, with the blueprint-driven workflow that became the
        formalize-paper skill of the lml plugin (https://github.com/LeanMachineLearning/lml-claude).
        Converted to lml-paper-template on 2026-11-09; since then scripts/formalize.sh drives the
        unattended rounds, and Tau Ceti workers port the library-shaped results to LMLExplore.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    An AI agent (Claude Code) checked the headline statements against the paper, in the
    phase-1 statement check of 2026-10-08; no human has reviewed them yet. Comparator verifies
    that the project proves exactly them (13 challenges, all verified on 2026-11-09).

alignment:
  namespace: "MaynardZhang2026Complexity"
  note: >-
    The full source-to-Lean map is the blueprint: each environment of blueprint/src/chapters/*.tex
    carries a \lean{} tag. Only the headline statements, the 13 comparator challenges, are repeated
    here; they formalize every numbered result of the paper (Appendix C, the computation of the
    adjacent pairs, states none). Each has its Literature Links relation, read "paper relation
    Lean": exactMatch, closeMatch, broadMatch (the Lean statement is more general), narrowMatch
    (the paper's is) or hasPart; and its entry in notes/paper-errata.md when the paper had to be
    corrected.
  statements:
    - source: "lem:adjacency — Lemma 1, adjacency lemma"
      lean: "MaynardZhang2026Complexity.exists_pos_inner_iff"
      module: "MaynardZhang2026Complexity.MXJF2026.Lemma1"
      status: "proved"
      relation: "exactMatch"
    - source: "thm:lower_bound — Theorem 1, arm-set-dependent lower bound"
      lean: "MaynardZhang2026Complexity.exists_minGapGE_le_max_error"
      module: "MaynardZhang2026Complexity.MXJF2026.Theorem1"
      status: "proved"
      relation: "narrowMatch"
      erratum: "E2"
      note: >-
        For T ≥ 1 and at least two arms; the paper states it for every horizon and arm set, and it
        is false for T = 0 or a single arm.
    - source: "lem:gen_lower — Lemma 2, non-stationary Kaufmann-Cappé-Garivier bound"
      lean: "MaynardZhang2026Complexity.le_max_prob_ne"
      module: "MaynardZhang2026Complexity.MXJF2026.Lemma2"
      status: "proved"
      relation: "closeMatch"
      note: >-
        For any two distinct arms k ≠ k', not only the best arms of ν and ν' (the proof does not use
        it), and for reward laws with finite Kullback-Leibler divergences instead of the paper's
        mutually absolutely continuous ones.
    - source: "lem:opt_lower — Lemma 3, optimization-based lower bound"
      lean: "MaynardZhang2026Complexity.exists_minGapGE_le_max_error_optValue"
      module: "MaynardZhang2026Complexity.MXJF2026.Lemma3"
      status: "proved"
      relation: "narrowMatch"
      erratum: "E2"
      note: >-
        For T ≥ 1 and at least two arms (false otherwise); the arm set need not span ℝ^d. The proof
        follows the corrected construction of E3, not the paper's half-horizon split.
    - source: "lem:equality — Lemma 4, closed form of the inner problem for adjacent pairs"
      lean: "MaynardZhang2026Complexity.pairValue_eq"
      module: "MaynardZhang2026Complexity.MXJF2026.Lemma4"
      status: "proved"
      relation: "broadMatch"
      note: "For every positive definite matrix A, not only the full-rank design matrices A(λ)."
    - source: "thm:upper_bound — Theorem 2, error probability of Adjacent-BAI"
      lean: "MaynardZhang2026Complexity.prob_ne_bestArm_le"
      module: "MaynardZhang2026Complexity.MXJF2026.Theorem2"
      status: "proved"
      relation: "closeMatch"
      note: >-
        The rounding procedure is not formalized: Adjacent-BAI plays any allocation with the
        rounding guarantee of Eq. (roundingerror), a hypothesis (IsAdjacentRounding), so the paper's
        T ≥ d², which only serves to obtain that guarantee, is dropped.
    - source: "lem:ls_subgaussian — Lemma 5, sub-Gaussian error of the least-squares estimator"
      lean: "MaynardZhang2026Complexity.hasSubgaussianMGF_lsEstimator"
      module: "MaynardZhang2026Complexity.MXJF2026.Lemma5"
      status: "proved"
      relation: "narrowMatch"
      erratum: "E1"
      note: >-
        With ‖x_t‖ ≤ 1 and ‖θ_t‖ ≤ 1, the assumptions of Theorem 2, without which the statement is
        false; for any allocation with invertible ∑_t x_t x_tᵀ.
    - source: "prop:stat_equiv — Proposition 1, the stationary complexity only involves adjacent arms"
      lean: "MaynardZhang2026Complexity.iInf_iSup_ratio_eq"
      module: "MaynardZhang2026Complexity.MXJF2026.Proposition1"
      status: "proved"
      relation: "exactMatch"
      note: >-
        The minima are over designs with positive definite design matrix. The arm set need not span
        ℝ^d: without it there is no such design and both sides are 0.
    - source: "lem:change_of_measure — Lemma 6, change of measure at a stopping time"
      lean: "MaynardZhang2026Complexity.trajMeasure_eq_lintegral_exp_neg_llrProcess"
      module: "MaynardZhang2026Complexity.MXJF2026.Lemma6"
      status: "proved"
      relation: "closeMatch"
      note: >-
        Rounds are numbered from 0, so the identity reads P_ν'(E) = E_ν[1_E exp(-L_{σ+1})], the
        paper's L_σ. For countably many arms (finitely many in the paper) and a stopping time finite
        everywhere.
    - source: "lem:pair_value_lower — Lemma 7, lower bound on the inner problem"
      lean: "MaynardZhang2026Complexity.le_pairValue"
      module: "MaynardZhang2026Complexity.MXJF2026.Lemma7"
      status: "proved"
      relation: "exactMatch"
    - source: "lem:pair_value_upper — Lemma 8, upper bound on the inner problem for adjacent pairs"
      lean: "MaynardZhang2026Complexity.pairValue_le"
      module: "MaynardZhang2026Complexity.MXJF2026.Lemma8"
      status: "proved"
      relation: "broadMatch"
      note: "For every Δ, not only Δ > 0 (for Δ ≤ 0 it is immediate: θ = v = 0 is feasible)."
    - source: "lem:perm_subgaussian — Lemma 9, sums over a uniform random permutation"
      lean: "MaynardZhang2026Complexity.hasSubgaussianMGF_sum_perm"
      module: "MaynardZhang2026Complexity.MXJF2026.Lemma9"
      status: "proved"
      relation: "exactMatch"
      note: >-
        The x_t need not span ℝ^d: without it the matrix is singular, its inverse is 0 in Lean, and
        both the sum and the variance proxy vanish.
    - source: "lem:ratio_adjacent — Lemma 10, the ratio is largest at an arm adjacent to x⋆"
      lean: "MaynardZhang2026Complexity.ratio_le_iSup_adjacentTo"
      module: "MaynardZhang2026Complexity.MXJF2026.Lemma10"
      status: "proved"
      relation: "exactMatch"
